[build]
  command = "npm run build"
  publish = "dist"

# The booking mail relay (optional — see docs/booking-email-setup.md).
functions = "netlify/functions"

# Let the browser reach the relay through the same /api/booking path that
# Vercel uses, so one code path works on both hosts.
[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200

# Read-only diagnosis of the booking → Google Sheet pipeline.
[[redirects]]
  from = "/api/booking-health"
  to = "/.netlify/functions/booking-health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
